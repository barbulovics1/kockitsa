name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Namestitev Pythona
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Namestitev orodij za Python
        run: pip install -r requirements-dev.txt

      - name: Lint backenda (Ruff)
        run: ruff check .

      - name: Namestitev Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Namestitev orodij za JavaScript
        run: npm ci

      - name: Lint frontenda (ESLint)
        run: npm run lint

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Namestitev Pythona
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Namestitev odvisnosti backenda
        run: pip install -r requirements.txt

      - name: Prevajanje kode backenda
        run: python -m compileall -q backend seed

      - name: Preverjanje, da se aplikacija naloži
        run: python -c "import backend.main"
        env:
          SECRET_KEY: ci-preverjanje

      - name: Priprava paketa za namestitev
        run: |
          mkdir -p dist
          rsync -a --exclude __pycache__ backend frontend db seed requirements.txt Dockerfile dist/

      - name: Shranjevanje artefakta
        uses: actions/upload-artifact@v7
        with:
          name: kockitsa-app
          path: dist/

      - name: Gradnja Docker slike
        run: docker build --platform linux/amd64 -t kockitsa:${{ github.sha }} dist

      - name: Izvoz Docker slike
        run: docker save kockitsa:${{ github.sha }} | gzip > kockitsa-slika.tar.gz

      - name: Shranjevanje Docker slike kot artefakt
        uses: actions/upload-artifact@v7
        with:
          name: kockitsa-slika
          path: kockitsa-slika.tar.gz
          retention-days: 7

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kockitsa
          POSTGRES_PASSWORD: kockitsa
          POSTGRES_DB: kockitsa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://kockitsa:kockitsa@localhost:5432/kockitsa_test
    steps:
      - uses: actions/checkout@v7

      - name: Namestitev Pythona
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Namestitev odvisnosti
        run: pip install -r requirements-dev.txt

      - name: Testi backenda (pytest)
        run: pytest --cov=backend --cov-report=xml --cov-report=html:coverage-backend

      - name: Namestitev Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Namestitev orodij za JavaScript
        run: npm ci

      - name: Testi frontenda (Vitest)
        run: npm test -- --coverage

      - name: Shranjevanje poročila o pokritosti
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: porocilo-pokritosti
          path: |
            coverage.xml
            coverage-backend/
            coverage-frontend/

  deploy:
    name: deploy
    needs: [lint, build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      SLIKA: ghcr.io/${{ github.repository_owner }}/kockitsa
    steps:
      - name: Prenos Docker slike iz joba build
        uses: actions/download-artifact@v8
        with:
          name: kockitsa-slika

      - name: Nalaganje Docker slike
        run: gunzip -c kockitsa-slika.tar.gz | docker load

      - name: Prijava v GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Objava slike v registru
        run: |
          docker tag kockitsa:${{ github.sha }} $SLIKA:${{ github.sha }}
          docker tag kockitsa:${{ github.sha }} $SLIKA:latest
          docker push $SLIKA:${{ github.sha }}
          docker push $SLIKA:latest

      - name: Namestitev na Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::Skrivnost RENDER_DEPLOY_HOOK še ni nastavljena, slika je samo objavljena v registru."
            exit 0
          fi
          SLIKA_URL=$(python3 -c "import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=''))" "$SLIKA:${{ github.sha }}")
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK&imgURL=$SLIKA_URL"
